{% load manga_extras %}
{% for chapter in chapters %}
<a href="{% url 'reader' chapter.mangadex_id %}" class="chapter-item"
   aria-label="{{ chapter.display_number }}{% if chapter.title %}: {{ chapter.title }}{% endif %}">
  <span class="chapter-item-num">{{ chapter.display_number }}</span>
  <span class="chapter-item-title">{% if chapter.title %}{{ chapter.title }}{% endif %}</span>
  <span class="chapter-item-meta">
    {% if chapter.scanlation_group %}{{ chapter.scanlation_group }} &bull; {% endif %}
    {{ chapter.published_at|date:"M j, Y"|default:"—" }}
  </span>
</a>
{% endfor %}
